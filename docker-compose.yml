# ════════════════════════════════════════════════════════════════════
# Ghost Workspace — Unified Orchestration (PostgreSQL)
# ════════════════════════════════════════════════════════════════════
# Start:    docker compose up -d
# Stop:     docker compose down
# Logs:     docker compose logs -f
# ════════════════════════════════════════════════════════════════════
#
# Port allocation:
#   Gateway (Unified API) → 18080
#   Nebula (Workflow)     → 2002
#   Alpha-ID (Identity)   → 8000
#   Flow (Workflow Engine)→ 3036
#   Net-Agent (Network)   → 18180
#   Orchestrator          → 19090
#   PostgreSQL            → 5432
# ════════════════════════════════════════════════════════════════════

services:
  # ── PostgreSQL (shared instance) ──
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    shm_size: 256mb
    environment:
      POSTGRES_USER: ${DB_USER:-ghost}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD required}
      POSTGRES_DB: ${DB_NAME:-ghost}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-ghost} -d ${DB_NAME:-ghost}"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  # ── Nebula (Workflow Engine) ──
  nebula:
    build:
      context: ./nebula
      dockerfile: Dockerfile
    ports:
      - "2002:2002"
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER:?DB_USER required}:${DB_PASSWORD:?DB_PASSWORD required}@db:5432/nebula
    env_file:
      - ./nebula/.env
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:2002/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ── Alpha-ID (Identity Layer) ──
  alphaid:
    build:
      context: ./alphaid/projects
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://${DB_USER:?DB_USER required}:${DB_PASSWORD:?DB_PASSWORD required}@db:5432/alpha_id
    env_file:
      - ./alphaid/projects/.env
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ── Flow (Workflow Engine — Fastify) ──
  flow:
    build:
      context: ./flow
      dockerfile: Dockerfile
    ports:
      - "3036:3036"
    environment:
      PORT: "3036"
      HOST: "0.0.0.0"
      NODE_ENV: production
      LOG_LEVEL: info
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3036/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ── Gateway (Unified API Gateway) ──
  gateway:
    build:
      context: ./ghost-main/gateway
      dockerfile: Dockerfile
    ports:
      - "18080:18080"
    environment:
      ALPHAID_URL: http://alphaid:8000
      NEBULA_URL: http://nebula:2002
      FLOW_URL: http://flow:3036
      NETAGENT_URL: http://netagent:18180
      ORCHESTRATOR_URL: http://orchestrator:19090
      GATEWAY_PORT: "18080"
    depends_on:
      alphaid:
        condition: service_healthy
      nebula:
        condition: service_healthy
      flow:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:18080/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ── Net-Agent (Network Operations) ──
  netagent:
    build:
      context: ./ghost-main
      dockerfile: net_agent_server/Dockerfile
    ports:
      - "18180:18180"
    environment:
      NET_AGENT_HOST: "0.0.0.0"
      NET_AGENT_PORT: "18180"
      GATEWAY_URL: http://gateway:18080
      ALPHAID_URL: http://alphaid:8000
      NEBULA_URL: http://nebula:2002
    env_file:
      - ./ghost-main/net_agent_server/.env
    depends_on:
      gateway:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:18180/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ── Orchestrator (Dual-Tool Coordination) ──
  orchestrator:
    build:
      context: ./orchestrator
      dockerfile: Dockerfile
    ports:
      - "19090:19090"
    environment:
      ORCHESTRATOR_HOST: "0.0.0.0"
      ORCHESTRATOR_PORT: "19090"
      GATEWAY_URL: http://gateway:18080
    depends_on:
      gateway:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:19090/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ── Feishu Bot (飞书 WebSocket Bot) ──
  feishu-bot:
    build:
      context: ./ghost-main/feishu-bot
      dockerfile: Dockerfile
    environment:
      FEISHU_APP_ID: ${FEISHU_APP_ID:?FEISHU_APP_ID required}
      FEISHU_APP_SECRET: ${FEISHU_APP_SECRET:?FEISHU_APP_SECRET required}
      CODEX_MAX_CONCURRENT: ${CODEX_MAX_CONCURRENT:-3}
      CODE_RUNNER_DIR: ${CODE_RUNNER_DIR:-/app/workspace}
    env_file:
      - ./ghost-main/feishu-bot/.env
    depends_on:
      gateway:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'python bot.py' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  pgdata:
