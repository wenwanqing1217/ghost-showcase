# ════════════════════════════════════════════════════════════════════
# Ghost Workspace — 统一编排（PostgreSQL）
# ════════════════════════════════════════════════════════════════════
# 启动: docker compose up -d
# 停止: docker compose down
# 日志: docker compose logs -f
# ════════════════════════════════════════════════════════════════════
#
# 端口分配:
#   MindFlow Web    → 3000
#   MindFlow API    → 3001
#   MindFlow Map    → 2002
#   DS Dashboard    → 3004
#   AID Alpha-ID    → 8000
#   ai综艺          → 5173 (需单独启动，非 Docker 化)
#   PostgreSQL      → 5432
# ════════════════════════════════════════════════════════════════════

services:
  # ── PostgreSQL 数据库（共享实例） ──
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    shm_size: 256mb
    environment:
      POSTGRES_USER: ${DB_USER:-ghost}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ghost_secret}
      POSTGRES_DB: ${DB_NAME:-ghost}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-ghost} -d ${DB_NAME:-ghost}"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  # ── MindFlow Map ──
  mindflow-map:
    build:
      context: ./mindflow-map
      dockerfile: Dockerfile
    ports:
      - "2002:2002"
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-ghost}:${DB_PASSWORD:-ghost_secret}@db:5432/mindflow_map
    env_file:
      - ./mindflow-map/.env
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:2002/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ── DS Dashboard ──
  ds:
    build:
      context: ./DS
      dockerfile: Dockerfile
    ports:
      - "3004:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${DB_USER:-ghost}:${DB_PASSWORD:-ghost_secret}@db:5432/ds?schema=public
      DEMO_MODE: ${DEMO_MODE:-false}
      DS_API_KEY: ${DS_API_KEY:-}
      DASH_USER: ${DASH_USER:-}
      DASH_PASS: ${DASH_PASS:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY_DS:-}
      SHOPIFY_SHOP_DOMAIN: ${SHOPIFY_SHOP_DOMAIN:-}
      SHOPIFY_ACCESS_TOKEN: ${SHOPIFY_ACCESS_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ── AID Alpha-ID ──
  aid:
    build:
      context: ./AID/projects
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://${DB_USER:-ghost}:${DB_PASSWORD:-ghost_secret}@db:5432/alpha_id
    env_file:
      - ./AID/projects/.env
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  pgdata:
