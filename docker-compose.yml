# ════════════════════════════════════════════════════════════════════
# Ghost Workspace — Unified Orchestration (PostgreSQL)
# ════════════════════════════════════════════════════════════════════
# Start:    docker compose up -d
# Stop:     docker compose down
# Logs:     docker compose logs -f
# ════════════════════════════════════════════════════════════════════
#
# Port allocation:
#   Gateway (Unified API) → 18080
#   Nebula (Workflow)     → 2002
#   Alpha-ID (Identity)   → 8000
#   Flow (Workflow Engine)→ 3036
#   Net-Agent (Network)   → 18180
#   Orchestrator          → 19090
#   Ghost DS (Dashboard)  → 3001
#   PostgreSQL            → 5432
#   Redis                 → 6379
# ════════════════════════════════════════════════════════════════════

services:
  # ── PostgreSQL (shared instance) ──
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    shm_size: 256mb
    environment:
      POSTGRES_USER: ${DB_USER:-ghost}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD required}
      POSTGRES_DB: ${DB_NAME:-ghost}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-ghost} -d ${DB_NAME:-ghost}"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  # ── Nebula (Workflow Engine) ──
  nebula:
    build:
      context: ./nebula
      dockerfile: Dockerfile
    ports:
      - "2002:2002"
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER:?DB_USER required}:${DB_PASSWORD:?DB_PASSWORD required}@db:5432/nebula
      CSRF_DISABLED: "true"
    env_file:
      - ./nebula/.env
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:2002/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ── Alpha-ID (Identity Layer) ──
  alphaid:
    build:
      context: ./alphaid/projects
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://${DB_USER:?DB_USER required}:${DB_PASSWORD:?DB_PASSWORD required}@db:5432/alpha_id
      AID_ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:8000,http://localhost:18080,http://127.0.0.1:3000,http://127.0.0.1:8000,http://127.0.0.1:18080"
      REDIS_URL: redis://redis:6379
    env_file:
      - ./alphaid/projects/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ── Flow (Workflow Engine — Fastify) ──
  flow:
    build:
      context: ./flow
      dockerfile: Dockerfile
    ports:
      - "3036:3036"
    environment:
      PORT: "3036"
      HOST: "0.0.0.0"
      NODE_ENV: production
      LOG_LEVEL: info
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3036/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ── Gateway (Unified API Gateway) ──
  gateway:
    build:
      context: ./ghost-main/gateway
      dockerfile: Dockerfile
    ports:
      - "18080:18080"
    environment:
      ALPHAID_URL: http://alphaid:8000
      NEBULA_URL: http://nebula:2002
      FLOW_URL: http://flow:3036
      NETAGENT_URL: http://netagent:18180
      ORCHESTRATOR_URL: http://orchestrator:19090
      DS_URL: http://ghost-ds:3000
      TOOL_A_URL: http://tool-a:8081
      TOOL_B_URL: http://tool-b:8082
      REDIS_URL: redis://redis:6379
      EVENT_STREAM_PREFIX: alphaid:events
      MONEYPRINTER_URL: http://moneyprinter:8080
      MONEYPRINTER_PUBLIC_URL: http://localhost:8080
      GAME_STORAGE_DIR: /app/generated_games
      GAME_PUBLIC_URL: http://localhost:18080/games
      GATEWAY_PORT: "18080"
      ENVIRONMENT: production
    env_file:
      - ./ghost-main/gateway/.env
    volumes:
      - ghost-games:/app/generated_games
    depends_on:
      alphaid:
        condition: service_healthy
      nebula:
        condition: service_healthy
      flow:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:18080/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ── Net-Agent (Network Operations) ──
  netagent:
    build:
      context: ./ghost-main
      dockerfile: net_agent_server/Dockerfile
    ports:
      - "18180:18180"
    environment:
      NET_AGENT_HOST: "0.0.0.0"
      NET_AGENT_PORT: "18180"
      GATEWAY_URL: http://gateway:18080
      ALPHAID_URL: http://alphaid:8000
      NEBULA_URL: http://nebula:2002
    env_file:
      - ./ghost-main/net_agent_server/.env
    depends_on:
      gateway:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:18180/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ── Orchestrator (Dual-Tool Coordination) ──
  orchestrator:
    build:
      context: .
      dockerfile: orchestrator/Dockerfile
    ports:
      - "19090:19090"
    environment:
      ORCHESTRATOR_HOST: "0.0.0.0"
      ORCHESTRATOR_PORT: "19090"
      GATEWAY_URL: http://gateway:18080
      TOOL_A_GATEWAY: http://gateway:18080/v1/tools/generate
      TOOL_B_GATEWAY: http://gateway:18080/v1/tools/optimize
      REDIS_URL: redis://redis:6379
      EVENT_STREAM_PREFIX: alphaid:events
      ENVIRONMENT: production
    env_file:
      - ./orchestrator/.env
    depends_on:
      gateway:
        condition: service_healthy
      tool-a:
        condition: service_healthy
      tool-b:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:19090/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ── ToolA (Code Generator) ──
  tool-a:
    build:
      context: ./tool-a
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${TOOL_A_BASE_URL:-https://api.deepseek.com}
      TOOL_A_MODEL: ${TOOL_A_MODEL:-deepseek-chat}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8081/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── ToolB (Code Optimizer) ──
  tool-b:
    build:
      context: ./tool-b
      dockerfile: Dockerfile
    ports:
      - "8082:8082"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${TOOL_B_BASE_URL:-https://api.deepseek.com}
      TOOL_B_MODEL: ${TOOL_B_MODEL:-deepseek-chat}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8082/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── MoneyPrinterTurbo (AI Video Generation) ──
  # 可选服务（profile: media）：仓库不含该目录，需用户自备后 `docker compose --profile media up`
  moneyprinter:
    profiles: ["media"]
    build:
      context: ./MoneyPrinterTurbo
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    command: ["python3", "main.py"]
    volumes:
      - ./MoneyPrinterTurbo/config.toml:/MoneyPrinterTurbo/config.toml
      - moneyprinter-data:/MoneyPrinterTurbo/storage
      - ghost-content:/ghost-content
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; r=urllib.request.urlopen('http://localhost:8080/api/v1/tasks'); assert r.status==200\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── Redis (Cache + Event Bus + Task Queue) ──
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  # ── Ghost DS (Next.js 电商看板) ──
  ghost-ds:
    build:
      context: ./DS
      dockerfile: Dockerfile
    ports:
      - "3001:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${DB_USER:?DB_USER required}:${DB_PASSWORD:?DB_PASSWORD required}@db:5432/ghost?schema=ds
      REDIS_URL: redis://redis:6379
      DEMO_MODE: "true"
      NEXT_PUBLIC_GATEWAY_URL: http://gateway:18080
    env_file:
      - ./DS/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ── Feishu Bot (Lark 命令中心 — WS 长连接 + 命令路由) ──
  # 凭证从主 .env 读取；未配置时容器休眠等待，不阻塞全栈启动
  feishu-bot:
    build:
      context: ./ghost-main/feishu-bot
      dockerfile: Dockerfile
    environment:
      FEISHU_APP_ID: ${FEISHU_APP_ID:-}
      FEISHU_APP_SECRET: ${FEISHU_APP_SECRET:-}
      KNOWN_CHAT_IDS: ${KNOWN_CHAT_IDS:-}
      DEFAULT_BACKEND: ${DEFAULT_BACKEND:-echo}
      CODE_RUNNER_DIR: ${CODE_RUNNER_DIR:-/app/workspace}
      CODEX_MAX_CONCURRENT: ${CODEX_MAX_CONCURRENT:-3}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-20}
      GATEWAY_URL: http://gateway:18080
      NEBULA_URL: http://nebula:2002
    depends_on:
      gateway:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'python bot.py' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ── Feishu Consumer (EventBus 通知推送) ──
  feishu-consumer:
    build:
      context: ./ghost-main/feishu-bot
      dockerfile: Dockerfile
    environment:
      FEISHU_APP_ID: ${FEISHU_APP_ID:-}
      FEISHU_APP_SECRET: ${FEISHU_APP_SECRET:-}
      REDIS_URL: redis://redis:6379
      EVENT_STREAM_PREFIX: alphaid:ecom
      FEISHU_CONSUMER_GROUP: feishu-notifiers
      FEISHU_CONSUMER_NAME: feishu-consumer-1
      FEISHU_BLOCK_TIMEOUT: ${FEISHU_BLOCK_TIMEOUT:-5000}
      FEISHU_BATCH_SIZE: ${FEISHU_BATCH_SIZE:-10}
    depends_on:
      redis:
        condition: service_healthy
      gateway:
        condition: service_healthy
    restart: unless-stopped
    command: python feishu_consumer.py
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import sys; print('consumer running')\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  pgdata:
  redisdata:
  moneyprinter-data:
  ghost-content:
  ghost-games:
