<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>💬 豆包 · Ghost 工作台</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh;}
header{padding:20px 24px;border-bottom:1px solid rgba(148,163,184,0.1);display:flex;align-items:center;justify-content:space-between;}
header h1{font-size:18px;display:flex;align-items:center;gap:8px;}
.badge{font-size:11px;background:rgba(56,189,248,0.15);color:#38bdf8;padding:3px 10px;border-radius:999px;}
.grid{display:grid;grid-template-columns:1fr;gap:16px;padding:20px;max-width:900px;margin:0 auto;}
@media(min-width:768px){.grid{grid-template-columns:1fr 1fr;}}
.card{background:rgba(30,41,59,0.8);backdrop-filter:blur(20px);border:1px solid rgba(148,163,184,0.1);border-radius:16px;padding:20px;}
.card h3{font-size:14px;color:#94a3b8;margin-bottom:12px;display:flex;align-items:center;gap:6px;}
.conv-item{padding:12px;border-radius:10px;cursor:pointer;transition:background .2s;border-bottom:1px solid rgba(148,163,184,0.05);}
.conv-item:hover{background:rgba(51,65,85,0.5);}
.conv-item:last-child{border:none;}
.conv-preview{font-size:13px;color:#e2e8f0;margin-bottom:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.conv-meta{font-size:11px;color:#64748b;display:flex;gap:12px;}
.tag{display:inline-block;font-size:10px;padding:2px 8px;border-radius:999px;background:rgba(56,189,248,0.1);color:#38bdf8;}
.status-bar{display:flex;gap:12px;align-items:center;font-size:12px;color:#64748b;}
.dot{width:6px;height:6px;border-radius:50%;display:inline-block;margin-right:4px;}
.dot.green{background:#22c55e;}
.dot.red{background:#ef4444;}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border:none;border-radius:10px;cursor:pointer;font-size:13px;transition:all .2s;}
.btn.primary{background:#38bdf8;color:#0f172a;}
.btn.primary:hover{background:#7dd3fc;}
.btn.secondary{background:rgba(51,65,85,0.6);color:#e2e8f0;}
.btn.secondary:hover{background:rgba(51,65,85,0.8);}
#messageList{max-height:500px;overflow-y:auto;}
</style>
</head>
<body>
<header>
  <h1>💬 豆包记忆桥 <span class="badge">Ghost Capture</span></h1>
  <div class="status-bar">
    <span id="gwStatus"><span class="dot red"></span>检查中</span>
    <span id="msgCount">0 条消息</span>
  </div>
</header>
<div class="grid">
  <div class="card" style="grid-column:1/-1;">
    <h3>📋 操作</h3>
    <div style="display:flex;gap:10px;flex-wrap:wrap;">
      <button class="btn primary" onclick="window.open('https://www.doubao.com','_blank')">打开豆包网页版</button>
      <button class="btn secondary" onclick="location.reload()">刷新</button>
      <button class="btn secondary" onclick="searchMemories()">🔍 搜索知识链</button>
    </div>
  </div>
  <div class="card" style="grid-column:1/-1;">
    <h3>📡 实时同步</h3>
    <div style="font-size:13px;color:#94a3b8;margin-bottom:12px;display:flex;gap:16px;flex-wrap:wrap;">
      <span>🟢 桌面端: <strong id="desktopStatus">运行中</strong></span>
      <span>🌐 网页端: <strong id="webStatus">等待加载</strong></span>
      <span>📝 Obsidian: <strong id="obsidianStatus">等待中</strong></span>
    </div>
  </div>
  <div class="card" style="grid-column:1/-1;">
    <h3>💬 最近同步对话</h3>
    <div id="messageList">
      <div style="text-align:center;padding:40px;color:#64748b;">加载中...</div>
    </div>
  </div>
</div>
<script>
const GATEWAY = 'http://localhost:18080';

async function checkStatus() {
  try {
    const r = await fetch(GATEWAY + '/health');
    const d = await r.json();
    const el = document.getElementById('gwStatus');
    if (d.success) {
      el.innerHTML = '<span class="dot green"></span>Gateway 已连接';
    } else {
      el.innerHTML = '<span class="dot red"></span>Gateway 异常';
    }
  } catch {
    document.getElementById('gwStatus').innerHTML = '<span class="dot red"></span>未连接';
  }
}

async function searchMemories() {
  const q = prompt('搜索豆包记忆关键词:');
  if (!q) return;
  try {
    const r = await fetch(GATEWAY + '/v1/chat', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        alpha_id: 'Alpha-001',
        message: '搜索记忆: ' + q
      })
    });
    const d = await r.json();
    const reply = d?.data?.reply || d?.reply || '无结果';
    const msgList = document.getElementById('messageList');
    msgList.innerHTML = '<div class="conv-item"><div class="conv-preview">' + reply + '</div></div>';
  } catch(e) {
    alert('搜索失败: ' + e.message);
  }
}

checkStatus();
setInterval(checkStatus, 30000);
</script>
</body>
</html>
