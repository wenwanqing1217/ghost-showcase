version: 2
updates:
  # Root GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # core (TypeScript)
  - package-ecosystem: "npm"
    directory: "/core"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  # flow (Next.js)
  - package-ecosystem: "npm"
    directory: "/flow"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  # nebula (Python — Workflow Engine)
  - package-ecosystem: "pip"
    directory: "/nebula"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  # alphaid (Python — Identity Layer)
  - package-ecosystem: "pip"
    directory: "/alphaid/projects"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
