version: 2
updates:
  # Root GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # DS (Node.js)
  - package-ecosystem: "npm"
    directory: "/DS"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  # zcode-brain (Node.js)
  - package-ecosystem: "npm"
    directory: "/zcode-brain"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  # mindflow-map (Python)
  - package-ecosystem: "pip"
    directory: "/mindflow-map"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  # AID (Python)
  - package-ecosystem: "pip"
    directory: "/AID/projects"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  # mindflow workspace (Node.js root)
  - package-ecosystem: "npm"
    directory: "/mindflow"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
