version: 2
updates:
  # Root GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # DS (Node.js)
  - package-ecosystem: "npm"
    directory: "/DS"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  # core (TypeScript)
  - package-ecosystem: "npm"
    directory: "/core"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  # nebula (Python — 执行层)
  - package-ecosystem: "pip"
    directory: "/nebula"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  # alphaid (Python — 身份层)
  - package-ecosystem: "pip"
    directory: "/alphaid/projects"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
