name: Monorepo CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------
  # 1. Detect which sub-projects have changes
  # ---------------------------------------------------------
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      nebula: ${{ steps.filter.outputs.nebula }}
      ds: ${{ steps.filter.outputs.ds }}
      aid: ${{ steps.filter.outputs.aid }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            nebula:
              - 'nebula/**'
            ds:
              - 'DS/**'
            aid:
              - 'alphaid/**'

  # ---------------------------------------------------------
  # 2. nebula (Python FastAPI — MindFlow Map)
  # ---------------------------------------------------------
  nebula:
    name: nebula CI
    needs: changes
    if: ${{ needs.changes.outputs.nebula == 'true' }}
    uses: ./.github/workflows/reusable-python-ci.yml
    with:
      project-dir: nebula
      python-versions: '["3.10", "3.11", "3.12"]'
      lint-command: 'ruff check src/ tests/'
      test-command: 'pytest tests/ -v --tb=short --cov=mindflow_map --cov-report=xml'

  # ---------------------------------------------------------
  # 3. DS (Next.js + Prisma)
  # ---------------------------------------------------------
  ds:
    name: DS CI
    needs: changes
    if: ${{ needs.changes.outputs.ds == 'true' }}
    uses: ./.github/workflows/reusable-node-ci.yml
    with:
      project-dir: DS
      node-version: "20"
      lint-command: 'npm run lint'
      test-command: 'npm test'
      build-command: 'npm run build'

  # ---------------------------------------------------------
  # 4. AID (Python — alphaid)
  # ---------------------------------------------------------
  aid:
    name: AID CI
    needs: changes
    if: ${{ needs.changes.outputs.aid == 'true' }}
    uses: ./.github/workflows/reusable-python-ci.yml
    with:
      project-dir: alphaid/projects
      python-versions: '["3.12"]'
      lint-command: 'ruff check src/'
      test-command: 'pytest tests/ -q --tb=short --cov=src --cov-report=term-missing --cov-fail-under=67'

  # ---------------------------------------------------------
  # 5. Final status gate — all triggered jobs must pass
  # ---------------------------------------------------------
  all-pass:
    name: All CI Passed
    runs-on: ubuntu-latest
    needs: [nebula, ds, aid]
    if: always()
    steps:
      - name: Check all CI results
        run: |
          echo "nebula: ${{ needs.nebula.result }}"
          echo "ds: ${{ needs.ds.result }}"
          echo "aid: ${{ needs.aid.result }}"

          if [ "${{ needs.nebula.result }}" == "failure" ] || \
             [ "${{ needs.ds.result }}" == "failure" ] || \
             [ "${{ needs.aid.result }}" == "failure" ]; then
            echo "::error::One or more CI jobs failed"
            exit 1
          fi

          if [ "${{ needs.nebula.result }}" == "skipped" ] && \
             [ "${{ needs.ds.result }}" == "skipped" ] && \
             [ "${{ needs.aid.result }}" == "skipped" ]; then
            echo "No sub-project changes detected — skipping"
            exit 0
          fi

          echo "All CI checks passed!"
