name: Monorepo CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------
  # 1. Detect which sub-projects have changes
  # ---------------------------------------------------------
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      nebula: ${{ steps.filter.outputs.nebula }}
      aid: ${{ steps.filter.outputs.aid }}
      gateway: ${{ steps.filter.outputs.gateway }}
      flow: ${{ steps.filter.outputs.flow }}
      netagent: ${{ steps.filter.outputs.netagent }}
      orchestrator: ${{ steps.filter.outputs.orchestrator }}
      ds: ${{ steps.filter.outputs.ds }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            nebula:
              - 'nebula/**'
            aid:
              - 'alphaid/**'
            gateway:
              - 'ghost-main/gateway/**'
            flow:
              - 'flow/**'
            netagent:
              - 'ghost-main/net_agent_server/**'
              - 'ghost-main/net_agent_common/**'
            orchestrator:
              - 'orchestrator/**'
            ds:
              - 'DS/**'

  # ---------------------------------------------------------
  # 2. nebula (Python FastAPI — Workflow Engine)
  # ---------------------------------------------------------
  nebula:
    name: nebula CI
    needs: changes
    if: ${{ needs.changes.outputs.nebula == 'true' }}
    uses: ./.github/workflows/reusable-python-ci.yml
    with:
      project-dir: nebula
      python-versions: '["3.10", "3.11", "3.12"]'
      lint-command: 'ruff check src/ tests/'
      test-command: 'pytest tests/ -v --tb=short --cov=mindflow_map --cov-report=xml'

  # ---------------------------------------------------------
  # 3. Registration tests (must pass first)
  # ---------------------------------------------------------
  registration:
    name: Registration CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: alphaid/projects
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pip install pytest httpx
      - run: python -m pytest tests/test_registration.py -v --noconftest

  # ---------------------------------------------------------
  # 4. AID (Python — Alpha-ID Identity)
  # ---------------------------------------------------------
  aid:
    name: AID CI
    needs: [changes, registration]
    if: ${{ needs.changes.outputs.aid == 'true' }}
    uses: ./.github/workflows/reusable-python-ci.yml
    with:
      project-dir: alphaid/projects
      python-versions: '["3.12"]'
      lint-command: 'ruff check src/'
      test-command: 'pytest tests/ -q --tb=short --cov=src --cov-report=term-missing --cov-fail-under=67'

  # ---------------------------------------------------------
  # 5. Gateway (Python FastAPI — Unified API Gateway)
  # ---------------------------------------------------------
  gateway:
    name: Gateway CI
    needs: changes
    if: ${{ needs.changes.outputs.gateway == 'true' }}
    uses: ./.github/workflows/reusable-python-ci.yml
    with:
      project-dir: ghost-main/gateway
      python-versions: '["3.12"]'
      lint-command: 'ruff check app.py config.py middleware/ routes/ services/ tests/'
      test-command: 'pytest tests/ -v --tb=short --cov=app --cov-report=xml'
    secrets: inherit

  # ---------------------------------------------------------
  # 6. Flow (Node.js — Workflow Engine)
  # ---------------------------------------------------------
  flow:
    name: Flow CI
    needs: changes
    if: ${{ needs.changes.outputs.flow == 'true' }}
    uses: ./.github/workflows/reusable-node-ci.yml
    with:
      project-dir: flow
      node-version: "20"
      lint-command: 'npx eslint apps/api/src --ext .ts'
      test-command: 'npm test -w apps/api'
      build-command: 'npm run build'

  # ---------------------------------------------------------
  # 7. Net-Agent (Python FastAPI — Network Operations)
  # ---------------------------------------------------------
  netagent:
    name: Net-Agent CI
    needs: changes
    if: ${{ needs.changes.outputs.netagent == 'true' }}
    uses: ./.github/workflows/reusable-python-ci.yml
    with:
      project-dir: ghost-main
      python-versions: '["3.12"]'
      lint-command: 'ruff check net_agent_server/ net_agent_common/'
      test-command: 'pytest net_agent_server/ -v --tb=short'

  # ---------------------------------------------------------
  # 8. Orchestrator (Python — Dual-Tool Coordination)
  # ---------------------------------------------------------
  orchestrator:
    name: Orchestrator CI
    needs: changes
    if: ${{ needs.changes.outputs.orchestrator == 'true' }}
    uses: ./.github/workflows/reusable-python-ci.yml
    with:
      project-dir: orchestrator
      python-versions: '["3.12"]'
      lint-command: 'ruff check main.py'
      test-command: 'pytest . -v --tb=short'

  # ---------------------------------------------------------
  # 9. Ghost DS (Next.js — E-Commerce Dashboard)
  # ---------------------------------------------------------
  ds:
    name: Ghost DS CI
    needs: changes
    if: ${{ needs.changes.outputs.ds == 'true' }}
    uses: ./.github/workflows/reusable-node-ci.yml
    with:
      project-dir: DS
      node-version: "20"
      # DS 无独立 eslint 配置，用 tsc 做类型门禁；vitest 为测试；构建前先 prisma generate
      lint-command: 'npx tsc --noEmit'
      test-command: 'npm test'
      build-command: 'npx prisma generate && npm run build'

  # ---------------------------------------------------------
  # 10. E2E Integration Test — full stack via Docker Compose
  # ---------------------------------------------------------
  e2e:
    name: E2E Integration Test
    runs-on: ubuntu-latest
    needs: [nebula, aid, gateway, flow, netagent, orchestrator]
    if: ${{ always() && (needs.nebula.result == 'success' || needs.aid.result == 'success' || needs.gateway.result == 'success' || needs.flow.result == 'success' || needs.netagent.result == 'success' || needs.orchestrator.result == 'success') }}
    env:
      DB_USER: ghost
      DB_PASSWORD: ghost-ci-password
      DB_NAME: ghost
    services:
      docker:
        image: docker:24-dind
        privileged: true
        options: >-
          --health-cmd "docker info"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Start Docker Compose stack
        run: |
          # 显式列出服务：跳过 MoneyPrinterTurbo（仓库不含该目录）
          docker compose up -d --build db redis nebula alphaid flow gateway netagent orchestrator tool-a tool-b ghost-ds
          # Wait for all services to be healthy (max 5 min)
          for i in $(seq 1 60); do
            unhealthy=$(docker compose ps --format "{{.Name}} {{.State}}" | grep -c "unhealthy\|starting" || true)
            if [ "$unhealthy" -eq 0 ]; then
              echo "All services healthy"
              break
            fi
            echo "Waiting for services... ($i/60) unhealthy=$unhealthy"
            sleep 5
          done
          docker compose ps
      - name: Run E2E verification
        run: |
          node scripts/e2e_test.mjs --wait
        env:
          GATEWAY_URL: http://localhost:18080
      - name: Tear down stack
        if: always()
        run: docker compose down -v

  # ---------------------------------------------------------
  # 10. Final status gate — all triggered jobs must pass
  # ---------------------------------------------------------
  all-pass:
    name: All CI Passed
    runs-on: ubuntu-latest
    needs: [nebula, aid, gateway, flow, netagent, orchestrator, ds, e2e]
    if: always()
    steps:
      - name: Check all CI results
        run: |
          echo "nebula: ${{ needs.nebula.result }}"
          echo "aid: ${{ needs.aid.result }}"
          echo "gateway: ${{ needs.gateway.result }}"
          echo "flow: ${{ needs.flow.result }}"
          echo "netagent: ${{ needs.netagent.result }}"
          echo "orchestrator: ${{ needs.orchestrator.result }}"
          echo "ds: ${{ needs.ds.result }}"
          echo "e2e: ${{ needs.e2e.result }}"

          if [ "${{ needs.nebula.result }}" == "failure" ] || \
             [ "${{ needs.aid.result }}" == "failure" ] || \
             [ "${{ needs.gateway.result }}" == "failure" ] || \
             [ "${{ needs.flow.result }}" == "failure" ] || \
             [ "${{ needs.netagent.result }}" == "failure" ] || \
             [ "${{ needs.orchestrator.result }}" == "failure" ] || \
             [ "${{ needs.ds.result }}" == "failure" ] || \
             [ "${{ needs.e2e.result }}" == "failure" ]; then
            echo "::error::One or more CI jobs failed"
            exit 1
          fi

          echo "All CI checks passed!"
