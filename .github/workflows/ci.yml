name: Monorepo CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------
  # 1. Detect which sub-projects have changes
  # ---------------------------------------------------------
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      mindflow-map: ${{ steps.filter.outputs.mindflow-map }}
      ds: ${{ steps.filter.outputs.ds }}
      aid: ${{ steps.filter.outputs.aid }}
      zcode-brain: ${{ steps.filter.outputs.zcode-brain }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            mindflow-map:
              - 'mindflow-map/**'
            ds:
              - 'DS/**'
            aid:
              - 'AID/**'
            zcode-brain:
              - 'zcode-brain/**'

  # ---------------------------------------------------------
  # 2. mindflow-map (Python FastAPI)
  # ---------------------------------------------------------
  mindflow-map:
    name: mindflow-map CI
    needs: changes
    if: ${{ needs.changes.outputs.mindflow-map == 'true' }}
    uses: ./.github/workflows/reusable-python-ci.yml
    with:
      project-dir: mindflow-map
      python-versions: '["3.10", "3.11", "3.12"]'
      lint-command: 'ruff check src/ tests/'
      test-command: 'pytest tests/ -v --tb=short --cov=mindflow_map --cov-report=xml'

  # ---------------------------------------------------------
  # 3. DS (Next.js + Prisma)
  # ---------------------------------------------------------
  ds:
    name: DS CI
    needs: changes
    if: ${{ needs.changes.outputs.ds == 'true' }}
    uses: ./.github/workflows/reusable-node-ci.yml
    with:
      project-dir: DS
      node-version: "20"
      lint-command: 'npm run lint'
      test-command: 'npm test'
      build-command: 'npm run build'

  # ---------------------------------------------------------
  # 4. AID (Python)
  # ---------------------------------------------------------
  aid:
    name: AID CI
    needs: changes
    if: ${{ needs.changes.outputs.aid == 'true' }}
    uses: ./.github/workflows/reusable-python-ci.yml
    with:
      project-dir: AID/projects
      python-versions: '["3.12"]'
      lint-command: 'ruff check src/'
      test-command: 'pytest tests/ -q --tb=short --cov=src --cov-report=term-missing --cov-fail-under=67'

  # ---------------------------------------------------------
  # 5. zcode-brain (Node/TS)
  # ---------------------------------------------------------
  zcode-brain:
    name: zcode-brain CI
    needs: changes
    if: ${{ needs.changes.outputs.zcode-brain == 'true' }}
    uses: ./.github/workflows/reusable-node-ci.yml
    with:
      project-dir: zcode-brain
      node-version: "20"
      lint-command: 'npm run lint'
      test-command: 'npm test'
      run-typecheck: true

  # ---------------------------------------------------------
  # 6. Final status gate — all triggered jobs must pass
  # ---------------------------------------------------------
  all-pass:
    name: All CI Passed
    runs-on: ubuntu-latest
    needs: [mindflow-map, ds, aid, zcode-brain]
    if: always()
    steps:
      - name: Check all CI results
        run: |
          echo "mindflow-map: ${{ needs.mindflow-map.result }}"
          echo "ds: ${{ needs.ds.result }}"
          echo "aid: ${{ needs.aid.result }}"
          echo "zcode-brain: ${{ needs.zcode-brain.result }}"

          if [ "${{ needs.mindflow-map.result }}" == "failure" ] || \
             [ "${{ needs.ds.result }}" == "failure" ] || \
             [ "${{ needs.aid.result }}" == "failure" ] || \
             [ "${{ needs.zcode-brain.result }}" == "failure" ]; then
            echo "::error::One or more CI jobs failed"
            exit 1
          fi

          if [ "${{ needs.mindflow-map.result }}" == "skipped" ] && \
             [ "${{ needs.ds.result }}" == "skipped" ] && \
             [ "${{ needs.aid.result }}" == "skipped" ] && \
             [ "${{ needs.zcode-brain.result }}" == "skipped" ]; then
            echo "No sub-project changes detected — skipping"
            exit 0
          fi

          echo "All CI checks passed!"
