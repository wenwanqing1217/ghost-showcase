name: Reusable Node CI

on:
  workflow_call:
    inputs:
      project-dir:
        required: true
        type: string
      node-version:
        required: false
        type: string
        default: "20"
      lint-command:
        required: false
        type: string
        default: 'npx eslint . --ext .ts,.tsx'
      test-command:
        required: false
        type: string
        default: 'npm test'
      build-command:
        required: false
        type: string
        default: ""
      run-typecheck:
        required: false
        type: boolean
        default: false

jobs:
  lint:
    name: Lint (${{ inputs.project-dir }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.project-dir }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: "npm"
          cache-dependency-path: ${{ inputs.project-dir }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: ${{ inputs.lint-command }}

  typecheck:
    name: Type Check (${{ inputs.project-dir }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.project-dir }}
    if: ${{ inputs.run-typecheck }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: "npm"
          cache-dependency-path: ${{ inputs.project-dir }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run type check
        run: npm run typecheck

  test:
    name: Test (${{ inputs.project-dir }})
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: ${{ inputs.project-dir }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: "npm"
          cache-dependency-path: ${{ inputs.project-dir }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: ${{ inputs.test-command }}

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ${{ inputs.project-dir }}-coverage
          path: ${{ inputs.project-dir }}/coverage/
          retention-days: 7

  build:
    name: Build (${{ inputs.project-dir }})
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: ${{ inputs.project-dir }}
    if: ${{ inputs.build-command != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: "npm"
          cache-dependency-path: ${{ inputs.project-dir }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: ${{ inputs.build-command }}
