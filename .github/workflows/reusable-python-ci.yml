name: Reusable Python CI

on:
  workflow_call:
    inputs:
      project-dir:
        required: true
        type: string
      python-versions:
        required: false
        type: string
        default: '["3.11"]'
      lint-python-version:
        required: false
        type: string
        default: "3.11"
        description: lint job 的 Python 版本（部分项目 requires-python 更高，如 alphaid >=3.12）
      lint-command:
        required: false
        type: string
        default: 'ruff check .'
      test-command:
        required: false
        type: string
        default: 'pytest tests/ -v --tb=short'

jobs:
  lint:
    name: Lint (${{ inputs.project-dir }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.project-dir }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.lint-python-version }}
          cache: "pip"
          cache-dependency-path: ${{ inputs.project-dir }}/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f pyproject.toml ]; then
            pip install -e ".[dev]" || pip install -e .
          else
            pip install -r requirements.txt
            pip install pytest pytest-asyncio httpx ruff pytest-cov
          fi

      - name: Run linter
        run: ${{ inputs.lint-command }}

  test:
    name: Test (${{ inputs.project-dir }}, Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: ${{ inputs.project-dir }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJson(inputs.python-versions) }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: ${{ inputs.project-dir }}/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f pyproject.toml ]; then
            pip install -e ".[dev]" || pip install -e .
          else
            pip install -r requirements.txt
            pip install pytest pytest-asyncio httpx ruff pytest-cov
          fi

      - name: Run tests
        run: ${{ inputs.test-command }}

      - name: Compute artifact name
        id: artifact-name
        # project-dir 可能含斜杠（如 ghost-main/gateway），artifact name 不允许
        run: |
          echo "name=$(echo '${{ inputs.project-dir }}' | tr '/' '-')-coverage-py${{ matrix.python-version }}" >> "$GITHUB_OUTPUT"

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ${{ steps.artifact-name.outputs.name }}
          path: ${{ inputs.project-dir }}/coverage.xml
          retention-days: 7
