# Monitoring stack override — compose with: docker compose -f docker-compose.yml -f docker-compose.override.yml up
# Adds Prometheus + Grafana for observability of all Ghost services.
version: "3.9"

services:
  prometheus:
    image: prom/prometheus:v2.54.0
    container_name: ghost-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    networks:
      - ghost-net

  grafana:
    image: grafana/grafana:11.1.0
    container_name: ghost-grafana
    restart: unless-stopped
    ports:
      - "3005:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: http://localhost:3000
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - ghost-net

volumes:
  prometheus-data: {}
  grafana-data: {}

networks:
  ghost-net:
    external: true
