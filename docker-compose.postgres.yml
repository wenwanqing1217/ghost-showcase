# PostgreSQL 生产数据库 — 用于 Ghost 矩阵
# 用法: docker-compose -f docker-compose.postgres.yml up -d
#
# ⚠️ 首次使用前请修改 POSTGRES_PASSWORD 并确保数据卷已创建

services:
  postgres:
    image: postgres:16-alpine
    container_name: ghost-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ghost
      POSTGRES_USER: ghost
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 未设置}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --locale=C"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ghost -d ghost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    # 安全：只暴露给本地，不绑定到 0.0.0.0（如需远程访问请用 SSH 隧道）
    # 如需远程访问，注释掉下面这行
    # network_mode: host

  # pgAdmin — 数据库管理界面（可选，开发用）
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ghost-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@ghost.local
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - dev  # 仅开发环境启动: docker-compose --profile dev up -d

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  default:
    name: ghost-network
