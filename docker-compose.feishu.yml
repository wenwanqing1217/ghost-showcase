# ════════════════════════════════════════════════════════════════════
# Ghost Platform — Optional Services (Feishu)
# ════════════════════════════════════════════════════════════════════
# Start:    docker compose -f docker-compose.yml -f docker-compose.feishu.yml up -d
# Stop:     docker compose -f docker-compose.yml -f docker-compose.feishu.yml down
# Requires: FEISHU_APP_ID + FEISHU_APP_SECRET in .env
# ════════════════════════════════════════════════════════════════════

services:
  feishu-bot:
    build:
      context: ./ghost-main/feishu-bot
      dockerfile: Dockerfile
    environment:
      # 飞书凭证（必填，从主 .env 读取，不再使用 feishu-bot/.env 文件）
      FEISHU_APP_ID: ${FEISHU_APP_ID:?FEISHU_APP_ID required}
      FEISHU_APP_SECRET: ${FEISHU_APP_SECRET:?FEISHU_APP_SECRET required}
      # 已知会话白名单（可选，逗号分隔 chat_id）
      KNOWN_CHAT_IDS: ${KNOWN_CHAT_IDS:-}
      # 默认后端 / 工作目录 / 速率限制
      DEFAULT_BACKEND: ${DEFAULT_BACKEND:-echo}
      CODE_RUNNER_DIR: ${CODE_RUNNER_DIR:-/app/workspace}
      CODEX_MAX_CONCURRENT: ${CODEX_MAX_CONCURRENT:-3}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-20}
      # Gateway 回调
      GATEWAY_URL: http://gateway:18080
    depends_on:
      gateway:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'python bot.py' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  feishu-consumer:
    build:
      context: ./ghost-main/feishu-bot
      dockerfile: Dockerfile
    environment:
      FEISHU_APP_ID: ${FEISHU_APP_ID:?FEISHU_APP_ID required}
      FEISHU_APP_SECRET: ${FEISHU_APP_SECRET:?FEISHU_APP_SECRET required}
      REDIS_URL: redis://redis:6379
      EVENT_STREAM_PREFIX: alphaid:ecom
      FEISHU_CONSUMER_GROUP: feishu-notifiers
      FEISHU_CONSUMER_NAME: feishu-consumer-1
      FEISHU_BLOCK_TIMEOUT: ${FEISHU_BLOCK_TIMEOUT:-5000}
      FEISHU_BATCH_SIZE: ${FEISHU_BATCH_SIZE:-10}
    depends_on:
      redis:
        condition: service_healthy
      gateway:
        condition: service_healthy
    restart: unless-stopped
    command: python feishu_consumer.py
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import sys; print('consumer running')\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
