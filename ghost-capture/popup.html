<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Ghost Capture</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{width:320px;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;background:#0f172a;color:#e2e8f0;padding:16px;}
h1{font-size:16px;margin-bottom:8px;color:#38bdf8;}
.status{display:flex;align-items:center;gap:8px;font-size:13px;padding:8px 12px;background:rgba(30,41,59,0.8);border-radius:12px;margin-bottom:12px;}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;}
.dot.green{background:#22c55e;}
.dot.red{background:#ef4444;}
.dot.yellow{background:#eab308;}
.meta{font-size:12px;color:#64748b;margin-top:8px;}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px;}
.stat-card{background:rgba(30,41,59,0.6);padding:10px;border-radius:10px;text-align:center;}
.stat-card .num{font-size:20px;font-weight:bold;color:#38bdf8;}
.stat-card .label{font-size:11px;color:#64748b;margin-top:2px;}
.btn{width:100%;padding:10px;border:none;border-radius:10px;cursor:pointer;font-size:13px;}
.btn.primary{background:#38bdf8;color:#0f172a;}
.btn.primary:hover{background:#7dd3fc;}
.btn.secondary{background:rgba(51,65,85,0.6);color:#e2e8f0;margin-top:8px;}
.btn.secondary:hover{background:rgba(51,65,85,0.8);}
</style>
</head>
<body>
<h1>👻 Ghost Capture</h1>
<div class="status">
  <span class="dot" id="statusDot"></span>
  <span id="statusText">检查连接中...</span>
</div>
<div class="stats">
  <div class="stat-card">
    <div class="num" id="msgCount">0</div>
    <div class="label">已捕获消息</div>
  </div>
  <div class="stat-card">
    <div class="num" id="sessionCount">0</div>
    <div class="label">会话数</div>
  </div>
</div>
<div class="meta" id="metaInfo">等待豆包页面加载...</div>
<button class="btn primary" id="openDoubao">打开豆包网页版</button>
<button class="btn secondary" id="openGhost">打开 Ghost</button>
<script src="popup.js"></script>
</body>
</html>
