name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  PYTHONPATH: src
  PIP_DISABLE_PIP_VERSION_CHECK: 1

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check src/ tests/

      - name: Type check with mypy
        run: mypy src/
        continue-on-error: true

      - name: Run unit tests
        run: pytest tests/unit/ -v --tb=short

      - name: Run integration tests
        run: pytest tests/integration/ -v --tb=short
        continue-on-error: true

      - name: Run all tests with coverage
        run: pytest tests/ --cov=mindflow_map --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: ${{ matrix.python-version }}
          name: mindflow-map-${{ matrix.python-version }}
        if: matrix.python-version == '3.11'

  frontend:
    name: Frontend Build (workflow-editor)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: workflow-editor/package-lock.json

      - name: Install frontend dependencies
        working-directory: workflow-editor
        run: npm ci

      - name: Type check
        working-directory: workflow-editor
        run: npm run typecheck

      - name: Lint
        working-directory: workflow-editor
        run: npm run lint
        continue-on-error: true

      - name: Build workflow-editor
        working-directory: workflow-editor
        run: npm run build

      - name: Upload frontend build artifact
        uses: actions/upload-artifact@v4
        with:
          name: workflow-editor-dist
          path: workflow-editor/dist/
          retention-days: 7

      - name: Verify dist entrypoints exist
        working-directory: workflow-editor
        run: |
          test -f dist/index.html
          test -d dist/assets
          echo "Frontend build artifacts verified"

  test-extra:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check src/ tests/

      - name: Type check with mypy
        run: mypy src/
        continue-on-error: true

      - name: Run unit tests
        run: pytest tests/unit/ -v --tb=short

      - name: Run integration tests
        run: pytest tests/integration/ -v --tb=short
        continue-on-error: true

      - name: Run all tests with coverage
        run: pytest tests/ --cov=mindflow_map --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: ${{ matrix.python-version }}
          name: mindflow-map-${{ matrix.python-version }}
        if: matrix.python-version == '3.11'

  security:
    name: Security audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Check for secrets in code
        run: |
          echo "Scanning for potential secrets..."
          if grep -rE "(password|secret|api_key|token)\s*=\s*['\"][^'\"]{8,}['\"]" src/ --include="*.py" | grep -v "your_placeholder\|your-api-key\|your_token\|test_\|_test\|example\|demo"; then
            echo "WARNING: Potential hardcoded secrets found"
            exit 1
          fi
          echo "No secrets detected"

      - name: Run pip audit
        run: |
          pip install pip-audit
          pip-audit --fix

  docker:
    name: Docker build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: mindflow-map:test
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new

      - name: Test Docker image starts
        run: |
          docker run -d -p 8000:8000 --name mindflow-test mindflow-map:test
          sleep 5
          curl -f http://localhost:8000/health/livez || exit 1
          docker stop mindflow-test