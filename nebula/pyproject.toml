[project]
name = "mindflow-map"
version = "0.1.0"
description = "MindFlow Map - AI智能地图助理，飞书/微信机器人"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "MindFlow Team" }
]
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "httpx>=0.24.0",
    "playwright>=1.40.0",
    "openai>=1.0.0",
    "cryptography>=41.0.0",
    "python-dotenv>=1.0.0",
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.19.0",
    "tenacity>=8.2.0",
    "alembic>=1.12.0",
    "asyncpg>=0.29.0",
    "redis>=5.0.0",
    "limits>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
]

[project.scripts]
mindflow-map = "mindflow_map.main:app"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "RUF"]
ignore = [
    "E501",   # line too long（交给 formatter）
    "RUF001", # 中文注释/文案的全角标点被误报为歧义字符
    "RUF002",
    "RUF003",
    "UP006",  # typing.List → list 现代化改写（代码库统一旧式注解，保持一致）
    "UP035",  # deprecated-import（同上）
    "UP045",  # Optional → X | None（同上）
    "RUF013", # implicit-optional（代码库风格）
    "RUF006", # asyncio.create_task 火后即忘（WebSocket/Webhook 分发场景刻意为之）
    "RUF012", # 类属性可变默认值（适配器元数据容器模式）
]
